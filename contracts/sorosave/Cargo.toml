[package]
name = "sorosave"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
soroban-token-sdk = { workspace = true }

[dev-dependencies]
proptest = "1.6.0"
soroban-sdk = { workspace = true, features = ["testutils"] }
